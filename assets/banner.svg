    <g transform="translate(748 67)">
      <path d="M45 224V104L205 26L365 104V224" stroke="#E8DED0" stroke-width="34" stroke-linejoin="round" filter="url(#raised)"/>
      <path d="M45 224V104L205 26L365 104V224" stroke="#F6F0E6" stroke-width="25" stroke-linejoin="round"/>
      <path d="M95 224V129L205 76L315 129V224" stroke="#DED3C4" stroke-width="4" filter="url(#line)"/>
      <path d="M126 224V148L205 110L284 148V224" stroke="#F8F3E9" stroke-width="18" filter="url(#raised)"/>
      <path d="M160 224V166L205 145L250 166V224" stroke="#D8CDBF" stroke-width="3"/>
      <path d="M19 224H391" stroke="#D5C9B8" stroke-width="2"/>
      <path d="M205 26V145M95 129L315 129M126 148L284 148" stroke="#CFC3B4" stroke-width="1.2" stroke-opacity=".7"/>
      <circle cx="205" cy="110" r="8" fill="#B39354"/><circle cx="205" cy="110" r="3" fill="#E5CF94"/>
      <text x="205" y="264" text-anchor="middle" fill="#625B52" font-family="Georgia, serif" font-size="11" letter-spacing="3.6">FORM / SILENCE / MEMORY</text>
    </g>
    <text x="1156" y="40" text-anchor="end" fill="#625B52" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text><text x="1156" y="57" text-anchor="end" direction="rtl" fill="#625B52" fill-opacity=".58" font-family="Arial, sans-serif" font-size="11" font-weight="700">العربية</text>
  </g>
  <g transform="translate(64 54)"><text x="0" y="20" fill="#514B44" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.4">🦁 XXD / IMAGE SKILL</text><text x="0" y="111" fill="#514B44" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-4">PANEL <tspan fill="#B39354">027</tspan></text><text x="2" y="151" fill="#514B44" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1">EMBOSS · INCISE · GOLD · SILENCE</text><text x="2" y="193" fill="#514B44" font-family="sans-serif" font-size="18" font-weight="700">东方纸张压印浮雕 · 乳白纸面上的博物馆秩序</text><text x="2" y="222" fill="#514B44" fill-opacity=".72" font-family="sans-serif" font-size="14" font-weight="600">東洋の紙圧印浮彫 · 동양 종이 압인 부조</text><text x="2" y="251" fill="#514B44" fill-opacity=".72" font-family="Arial, sans-serif" font-size="14" font-weight="600">نقش شرقي مضغوط في الورق</text></g>
  <g transform="translate(64 327)"><rect width="143" height="37" rx="7" fill="#514B44"/><text x="71.5" y="24" text-anchor="middle" fill="#F3EDE1" font-family="Courier New, monospace" font-size="12" font-weight="900">SOURCE-LED</text><rect x="155" width="106" height="37" rx="7" fill="#B39354"/><text x="208" y="24" text-anchor="middle" fill="#F3EDE1" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text><rect x="273" width="164" height="37" rx="7" fill="#D9CCB9"/><text x="355" y="24" text-anchor="middle" fill="#514B44" font-family="Courier New, monospace" font-size="12" font-weight="900">RELIEF DEPTH</text><rect x="449" width="147" height="37" rx="7" fill="#E7D9C6"/><text x="522.5" y="24" text-anchor="middle" fill="#514B44" font-family="Courier New, monospace" font-size="12" font-weight="900">RASTER ONLY</text></g>
