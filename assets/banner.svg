<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 027</title>
  <desc>Eastern museum bas-relief pressed into heavy ivory paper, with shallow embossing, fine incision, delicate warm shadows, one restrained matte-gold focus, and five-language documentation.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="paper" width="27" height="25" patternUnits="userSpaceOnUse"><path d="M3 8L12 7M17 21L25 20M7 24L12 23" stroke="#6F665A" stroke-opacity=".055" stroke-width=".7"/><circle cx="21" cy="6" r=".55" fill="#6F665A" fill-opacity=".055"/></pattern>
    <filter id="raised" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#746858" flood-opacity=".18"/><feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#FFFDF7" flood-opacity=".75"/></filter>
    <filter id="line" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#756A5B" flood-opacity=".22"/></filter>
  </defs>
  <g clip-path="url(#frame)">
